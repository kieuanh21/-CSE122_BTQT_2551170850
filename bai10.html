<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài10-Liên hệ với chúng tôi</title>
    <link rel="stylesheet" href="bai10.css">
</head>
<body>
    < class="container">
        <div class="header">
            <h1>Liên hệ với chúng tôi</h1>
            <p>Vui lòng điền thông tn bên dưới , chúng tôi sẽ phản hồi trong24h</p>
        </div>
            <div class="row">
                <div class="form-group">
                    <label for="name">họ và tên</label>
                    <input type="text" id="name">
                </div>
            </div>

  <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone">
                </div>

                <div class="form-group">
                    <label for="subject">Chủ đề</label>
                    <select id="subject">
                        <option>Hỏi về khoá học</option>
                        <option>Hỏi về bài tập</option>
                        <option>Góp ý</option>
                        <option>Khác</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Nội dung</label>
                <textarea id="message" name="massage" rows="5"></textarea>
           

            <div class="agree">
                <input type="checkbox" id="agree" checked>
                <label for="agree">Tôi đồng ý nhận email phản hồi.</label>
            </div>

            <div class="buttons">
                <button type="submit" class="send">Gửi liên hệ</button>
                <button type="reset" class="reset">Nhập lại</button>
            </div>
        </form>

    </div>

</body>
</html>
