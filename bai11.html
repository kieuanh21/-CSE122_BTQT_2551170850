<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11-Thư viện ảnh</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            background-color: #0f172a;
            color:#e2e8f0;
            max-width: 900px;
            margin:auto;
            padding:20px;
        }
        header{
            text-align: center;
        }
        header p{
            color:#e2e8f0;
            font-size: 14px;
        }
        .gallery{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:15px;
        }
        figure{
            margin:0;
            background-color: #1e293b;
            border-radius: 8px;
            overflow:hidden;
        }
        img{
            width:100%;
            height:180px;
            object-fit: cover;
            display:block;

        }
        figcaption{
            padding:8px;
            font-style: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <hearder>
        <h1>Thư viện ảnh Việt Nam</h1>
        <p>Bộ sưu tầm 6 danh thắng tiêu biểu- minh họa thẻ figure/ficaption</p>
    </hearder>
    <div class="gallery">
        <figure>
            <img src="../Anh/Bai11/1-vinh-ha-long.jpg">
            <figcaption>Hình1.Vịnh hạ Long</figcaption>
        </figure>
        <figure>
      <img src="../Anh/Bai11/2-son-doong.jpg" alt="Hang Sơn Đoòng">
      <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
    </figure>
    <figure>
      <img src="../Anh/Bai11/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
      <figcaption>Hình 3. Thác Bản Giốc</figcaption>
    </figure>
    <figure>
      <img src="../Anh/Bai11/4-fansipan.jpg" alt="Fansipan">
      <figcaption>Hình 4. Fansipan</figcaption>
    </figure>
    <figure>
      <img src="../Anh/Bai11/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
      <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
    </figure>
    <figure>
      <img src="../Anh/Bai11/6-phong-nha.jpg" alt="Động Phong Nha">
      <figcaption>Hình 6. Động Phong Nha</figcaption>
    </figure>
    </div>
</body>
</html>
